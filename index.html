<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ruta QA Automation · Cristian Guerra</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#0f1621; --panel2:#141d29; --line:#1e2a36;
    --txt:#f3f4f6; --muted:#9ca3af; --dim:#6b7280;
    --fund:#22d3ee; --setup:#a78bfa; --auto:#10b981; --eng:#f97316; --ia:#facc15; --cap:#f3f4f6;
    --radius:16px; --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased}
  a{color:var(--fund);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}

  header.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);padding:46px 0 34px;
    background:radial-gradient(1200px 420px at 12% -20%,rgba(34,211,238,.22),transparent),
               radial-gradient(1000px 420px at 92% -30%,rgba(249,115,22,.16),transparent),
               radial-gradient(800px 500px at 60% 120%,rgba(167,139,250,.12),transparent),var(--panel)}
  .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--fund);font-weight:800}
  h1{font-size:33px;line-height:1.12;margin:10px 0 8px;letter-spacing:-.02em}
  h1 .g{background:linear-gradient(90deg,#22d3ee,#a78bfa,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);max-width:800px;font-size:15.5px}
  .meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
  .chip{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--muted)}
  .chip b{color:var(--txt)}
  .mentorbox{display:flex;gap:14px;align-items:center;margin-top:22px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-width:720px}
  .avatar{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#06121a;background:linear-gradient(135deg,#22d3ee,#f97316)}
  .mentorbox p{margin:0;font-size:13.5px;color:#cbd2e0}
  .mentorbox b{color:var(--txt)}

  .progwrap{position:sticky;top:0;z-index:30;background:rgba(11,13,19,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .progwrap .inner{max-width:1140px;margin:0 auto;padding:9px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .bar{flex:1;min-width:120px;height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#10b981);transition:width .35s}
  .pct{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:42px;text-align:right}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}
  .btn:hover{color:var(--txt);border-color:var(--fund)}

  h2{font-size:22px;margin:46px 0 6px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
  .lead{color:var(--muted);margin:0 0 18px;max-width:820px}

  /* how-to + rules */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:800px){.two{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .card h4{margin:0 0 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fund)}
  ul.tight{margin:0;padding-left:18px} ul.tight li{margin:6px 0;font-size:13.5px;color:#cbd2e0} ul.tight li b{color:var(--txt)}

  /* MAP */
  .maplegend{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 16px}
  .maplegend span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .ldot{width:11px;height:11px;border-radius:50%}
  #map{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
  .node{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s;overflow:hidden}
  .node:hover{transform:translateY(-3px);box-shadow:0 12px 30px -14px rgba(0,0,0,.6)}
  .node::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
  .node .nn{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .node .nicon{font-size:20px;margin:2px 0 6px}
  .node .ntitle{font-size:13px;font-weight:700;line-height:1.25}
  .node .ntrack{font-size:10px;color:var(--tc);text-transform:uppercase;letter-spacing:.05em;margin-top:8px;font-weight:700}
  .node .ring{position:absolute;top:12px;right:12px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
  .node.done{border-color:var(--auto)}
  .node.done .ring{background:var(--auto);border-color:var(--auto)}
  .node.done .ring::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#0b0d13;font-weight:900}

  /* MODULES */
  .mod{scroll-margin-top:70px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin:16px 0;overflow:hidden;position:relative}
  .mod::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
  .mod.done{border-color:rgba(16,185,129,.45)}
  .mhead{display:flex;align-items:center;gap:16px;padding:20px 22px;cursor:pointer}
  .mnum{width:48px;height:48px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:color-mix(in srgb,var(--tc) 18%,transparent);border:1px solid color-mix(in srgb,var(--tc) 40%,transparent)}
  .mhcol{flex:1;min-width:0}
  .mttl{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .mmeta{font-size:12px;color:var(--dim);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
  .mmeta b{color:var(--tc)}
  .caret{color:var(--dim);transition:transform .2s;font-size:14px}
  .mod.open .caret{transform:rotate(90deg)}
  .mbody{display:none;padding:0 22px 22px;border-top:1px solid var(--line)}
  .mod.open .mbody{display:block}
  .mentor{display:flex;gap:12px;margin:18px 0;background:linear-gradient(90deg,rgba(34,211,238,.10),transparent);border:1px solid rgba(34,211,238,.22);border-radius:12px;padding:13px 15px}
  .mentor .mav{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#22d3ee,#f97316);display:flex;align-items:center;justify-content:center;font-weight:800;color:#06121a;font-size:13px}
  .mentor .mtext{font-size:13.5px;color:#dfe4ee}
  .mentor .mtext .who{font-size:11px;color:#22d3ee;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .seclbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
  .seclbl::after{content:'';flex:1;height:1px;background:var(--line)}
  .reslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .res{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;transition:border-color .15s,transform .15s}
  .res:hover{border-color:var(--tc);transform:translateY(-2px);text-decoration:none}
  .res .ric{font-size:16px;flex-shrink:0;margin-top:1px}
  .res .rmain{min-width:0}
  .res .rlabel{font-size:13px;font-weight:600;color:var(--txt);line-height:1.25}
  .res .rtype{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:2px}
  .res .rtype.free{color:var(--auto)}
  .hands{background:linear-gradient(90deg,rgba(16,185,129,.10),transparent);border:1px solid rgba(16,185,129,.28);border-radius:12px;padding:14px 16px;margin-top:16px}
  .hands .hl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--auto);font-weight:800;margin-bottom:8px}
  .deliver{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .deliver input{margin-top:3px;width:17px;height:17px;accent-color:var(--auto);cursor:pointer}
  .deliver label{font-size:13.5px;color:#dfe4ee;cursor:pointer}
  .deliver label b{color:var(--txt)}

  .foot{color:var(--dim);font-size:12.5px;text-align:center;margin:50px 0 70px;border-top:1px solid var(--line);padding-top:22px}
  code{font-family:var(--mono);font-size:12px;background:var(--panel2);padding:1px 6px;border-radius:5px;color:var(--fund)}
  .glos-input{width:100%;max-width:480px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--txt);font-size:14px;font-family:inherit;margin-bottom:14px}
  .glos-input:focus{outline:none;border-color:var(--fund)}
  .glos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .glos-item{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  .glos-item .gt{font-weight:700;font-size:13.5px;color:var(--fund)}
  .glos-item .gd{font-size:12.5px;color:#cbd2e0;margin-top:3px}
  .quiz{margin-top:16px;background:linear-gradient(90deg,rgba(34,211,238,.07),transparent);border:1px solid rgba(34,211,238,.22);border-radius:12px;padding:14px 16px}
  .quiz .ql{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fund);font-weight:800;margin-bottom:4px}
  .quiz .qq{font-size:13.5px;font-weight:600;color:var(--txt);margin:12px 0 6px}
  .quiz .qo{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin:5px 0;color:#cbd2e0;font-size:13px;cursor:pointer;font-family:inherit;transition:border-color .15s}
  .quiz .qo:hover{border-color:var(--fund)}
  .quiz .qo.ok{border-color:var(--auto);background:rgba(16,185,129,.14);color:#eafff5}
  .quiz .qo.no{border-color:#f43f5e;background:rgba(244,63,94,.12)}
  .quiz .qwhy{font-size:12px;color:var(--muted);margin-top:8px;padding-left:10px;border-left:2px solid var(--auto);display:none}
  .quiz .qwhy.show{display:block}
  .quiz .qo:disabled{cursor:default}
  .qprog{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
  .qbar{flex:1;height:6px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .qbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#10b981);transition:width .3s}
  .qcount{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:52px;text-align:right}
  .qcard{animation:qin .25s ease}
  @keyframes qin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .qnext{margin-top:14px;background:linear-gradient(90deg,#22d3ee,#10b981);color:#06121a;font-weight:800;border:none;border-radius:10px;padding:10px 20px;cursor:pointer;font-family:inherit;font-size:13px}
  .qnext:hover{filter:brightness(1.08)}
  .qend{text-align:center;padding:14px 0 6px;animation:qin .25s ease}
  .qbig{font-size:20px;font-weight:800}
  .qbig2{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--fund);margin:8px 0}
  .qbig2 span{font-size:15px;color:var(--muted)}
  .qsub{font-size:13px;color:var(--muted);max-width:480px;margin:0 auto 4px}
  .exambadge{font-family:var(--mono);font-size:12.5px;color:var(--auto);font-weight:700}
  /* Router: home = mapa como índice; cada módulo es su propia página (#/m1) */
  #modules{display:none}
  body.modview #modules{display:block}
  body.modview .homeonly{display:none!important}
  body.modview .mod{display:none}
  body.modview .mod.active{display:block;margin-top:16px}
  body.modview .mod.active .mbody{display:block}
  body.modview .mod.active .mhead{cursor:default}
  body.modview .mod.active .caret{display:none}
  .modnav{display:none;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 0;font-size:13px;flex-wrap:wrap}
  body.modview .modnav{display:flex}
  .modnav a{color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:var(--panel2)}
  .modnav a:hover{color:var(--txt);border-color:var(--fund);text-decoration:none}
  .modnav .mpos{font-family:var(--mono);font-size:12px;color:var(--dim)}

  @media print{.progwrap,.btn,#map,.modnav{display:none}#modules,.mod,.mbody{display:block!important}}

  /* GATE (dashboard de entrada + login) */
  #gate{display:none;min-height:100vh;padding:56px 0 40px;
    background:radial-gradient(1200px 420px at 12% -20%,rgba(34,211,238,.22),transparent),
               radial-gradient(1000px 420px at 92% -30%,rgba(249,115,22,.16),transparent),
               radial-gradient(800px 500px at 60% 120%,rgba(167,139,250,.12),transparent),var(--bg)}
  body.gated #gate{display:block}
  body.gated>:not(#gate):not(#notice):not(#langsw):not(script){display:none}
  .gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:26px 0 20px}
  .gstat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center}
  .gstat b{display:block;font-size:24px;color:var(--fund);letter-spacing:-.01em}
  .gstat span{font-size:12px;color:var(--muted)}
  .gcta{text-align:center;margin-top:32px}
  .gbtn{background:linear-gradient(90deg,#22d3ee,#10b981);color:#06121a;font-weight:800;font-size:16px;border:none;border-radius:12px;padding:14px 30px;cursor:pointer;font-family:inherit;box-shadow:0 10px 30px -10px rgba(34,211,238,.45)}
  .gbtn:hover{filter:brightness(1.08)}
  .gnote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.7}
  .avatar,.mentor .mav{background:url(avatar.jpg) center/cover;color:transparent}
  .gav{width:72px;height:72px;border-radius:50%;background:url(avatar.jpg) center/cover;margin-bottom:16px;border:2px solid rgba(34,211,238,.45);box-shadow:0 8px 24px -8px rgba(34,211,238,.5)}
  .lvlhead{grid-column:1/-1;margin:14px 0 2px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tc)}
  .kid{margin:0 0 14px;padding:12px 14px;border-radius:12px;border:1px dashed rgba(250,204,21,.45);background:rgba(250,204,21,.06);font-size:14px}
  .goals{margin:8px 0 4px}.goals .card p{margin:0;font-size:14px;color:#dfe4ee}
  .mutw{margin:14px 0 0;padding:12px 14px;border-radius:12px;border:1px solid rgba(251,113,133,.4);background:rgba(251,113,133,.07);font-size:14px}
  .mutw b{display:block;margin-bottom:4px;color:#fb7185;font-size:11px;letter-spacing:.07em;text-transform:uppercase}
  .evalnote{font-size:13.5px;color:#dfe4ee;margin:6px 0 10px}.qbest{color:var(--auto);font-weight:700}
  .rubwrap{overflow-x:auto}.rub{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
  .rub th,.rub td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
  .rub th{background:var(--panel2);font-size:11.5px;letter-spacing:.04em}
  .qverdict{font-weight:800;margin-right:4px}.qverdict.okv{color:#10b981}.qverdict.nov{color:#f43f5e}
  .notice{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;max-width:min(680px,calc(100% - 32px));padding:12px 16px;border-radius:12px;background:#0f1621;border:1px solid var(--line);color:var(--txt);font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
  .notice.error{border-color:#f43f5e}.notice.ok{border-color:#10b981}
  .hands pre{font-family:var(--mono);font-size:12.5px;background:#0b111a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre;margin:8px 0}
  body.loading>:not(#bootmsg):not(#langsw):not(script){display:none!important}
  #bootmsg{display:none;max-width:640px;margin:80px auto;padding:0 16px;color:var(--muted);text-align:center}
  body.loading #bootmsg{display:block}
  .langsw{position:fixed;top:10px;right:12px;z-index:45;display:flex;gap:4px;background:rgba(10,14,20,.85);border:1px solid var(--line);border-radius:10px;padding:3px}
  .langsw button{background:transparent;border:0;color:var(--muted);font-weight:800;font-size:12px;letter-spacing:.06em;padding:5px 9px;border-radius:7px;cursor:pointer}
  .langsw button[aria-pressed="true"]{background:var(--panel2);color:var(--txt)}
</style>
</head>
<body class="gated loading">

<div id="langsw" class="langsw"></div>
<div id="notice" class="notice" role="status" hidden></div>
<div id="bootmsg">Cargando el curso… / Loading the course…</div>

<section id="gate">
  <div class="wrap">
    <div class="gav"></div>
    <div class="eyebrow" data-i18n="home.gate.eyebrow"></div>
    <h1 data-i18n="home.gate.title"></h1>
    <p class="sub" data-i18n="home.gate.sub"></p>
    <div class="gstats">
      <div class="gstat" data-i18n="home.gate.stat1"></div>
      <div class="gstat" data-i18n="home.gate.stat2"></div>
      <div class="gstat" data-i18n="home.gate.stat3"></div>
      <div class="gstat" data-i18n="home.gate.stat4"></div>
    </div>
    <div class="two">
      <div class="card"><h4 data-i18n="home.gate.goalsTitle"></h4><ul class="tight" data-i18n="home.gate.goals"></ul></div>
      <div class="card"><h4 data-i18n="home.gate.howTitle"></h4><ul class="tight" data-i18n="home.gate.how"></ul></div>
    </div>
    <div class="gcta">
      <button class="gbtn" onclick="doAuth()" data-i18n="home.gate.cta"></button>
      <p class="gnote"><span data-i18n="home.gate.note"></span><br/>
      <a href="#" onclick="enterGuest();return false" data-i18n="home.gate.guest"></a> <span style="color:var(--dim)" data-i18n="home.gate.guestHint"></span></p>
    </div>
  </div>
</section>

<header class="hero homeonly">
  <div class="wrap">
    <div class="eyebrow" data-i18n="home.hero.eyebrow"></div>
    <h1 data-i18n="home.hero.title"></h1>
    <p class="sub" data-i18n="home.hero.sub"></p>
    <div class="meta" data-i18n="home.hero.chips"></div>
    <div class="mentorbox">
      <div class="avatar">CG</div>
      <p data-i18n="home.hero.mentor"></p>
    </div>
  </div>
</header>

<div class="progwrap">
  <div class="inner">
    <span style="font-size:12px;color:var(--muted)" data-i18n="ui.progress.label"></span>
    <div class="bar"><i id="barfill"></i></div>
    <span class="pct" id="pcttxt">0%</span>
    <span id="authWho" style="font-size:12px;color:var(--muted)"></span>
    <button id="authBtn" class="btn" onclick="doAuth()" style="display:none"></button>
    <button class="btn" onclick="window.print()" data-i18n="ui.progress.pdf"></button>
    <button class="btn" onclick="resetProg()" data-i18n="ui.progress.reset"></button>
  </div>
</div>

<div class="wrap">

  <h2 class="homeonly" data-i18n="home.use.title"></h2>
  <div class="two homeonly">
    <div class="card"><h4 data-i18n="home.use.pactTitle"></h4><ul class="tight" data-i18n="home.use.pact"></ul></div>
    <div class="card"><h4 data-i18n="home.use.rulesTitle"></h4><ul class="tight" data-i18n="home.use.rules"></ul></div>
  </div>

  <h2 class="homeonly" data-i18n="home.map.title"></h2>
  <p class="lead homeonly" data-i18n="home.map.evalLead"></p>
  <p class="lead homeonly" data-i18n="home.map.lead"></p>
  <div class="maplegend homeonly" id="legend"></div>
  <div id="map" class="homeonly"></div>

  <div class="modnav">
    <a href="#/" data-i18n="ui.nav.map"></a>
    <span class="mpos" id="modpos"></span>
    <span style="display:flex;gap:8px;flex-wrap:wrap"><a id="prevmod" href="#/"></a><a id="nextmod" href="#/"></a></span>
  </div>
  <div id="modules"></div>

  <h2 class="homeonly" data-i18n="home.exam.title"></h2>
  <p class="lead homeonly"><span data-i18n="home.exam.lead"></span> <span class="exambadge" id="exambadge"></span></p>
  <div class="qmount homeonly" data-mid="final"></div>

  <h2 class="homeonly" data-i18n="home.glos.title"></h2>
