<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cómo te evalúas · Ruta QA Automation</title>
<style>
  :root{--bg:#0a0e14;--panel:#0f1621;--panel2:#141d29;--line:#1e2a36;--txt:#f3f4f6;--muted:#9ca3af;--mint:#10b981;--cyan:#22d3ee;--gold:#facc15;--coral:#fb7185}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.6;font-size:15px}
  a{color:var(--cyan)}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px 60px}
  header{padding:36px 0 10px}
  .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:800}
  h1{font-size:30px;line-height:1.15;margin:8px 0}
  h2{font-size:21px;margin:34px 0 10px}
  .lead{color:var(--muted);max-width:780px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .grid .card{margin:0}
  .card h3{margin:0 0 6px;font-size:15px}
  .card p{margin:0;color:#dfe4ee;font-size:14px}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:var(--panel2)}
  code{font-family:Menlo,Consolas,monospace;font-size:.9em;background:#141d29;padding:1px 5px;border-radius:5px}
  img{max-width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}
  .kid{border:1px dashed rgba(250,204,21,.45);background:rgba(250,204,21,.06)}
  .foot{margin-top:40px;color:var(--muted);font-size:13px}
  .pass{color:var(--mint);font-weight:700}.fail{color:var(--coral);font-weight:700}.warn{color:var(--gold);font-weight:700}
  .card ul{margin:0;padding-left:20px}.card li{margin:6px 0;font-size:14px}
  .langsw{position:fixed;top:10px;right:12px;z-index:45;display:flex;gap:4px;background:rgba(10,14,20,.85);border:1px solid var(--line);border-radius:10px;padding:3px}
  .langsw button{background:transparent;border:0;color:var(--muted);font-weight:800;font-size:12px;letter-spacing:.06em;padding:5px 9px;border-radius:7px;cursor:pointer}
  .langsw button[aria-pressed="true"]{background:var(--panel2);color:var(--txt)}
</style>
</head>
<body>
<div id="langsw" class="langsw"></div>
<div class="wrap">
<div data-i18n="eval.intro">Cargando… / Loading…</div>
<section data-i18n="eval.s01"></section>
<section data-i18n="eval.s02"></section>
<section data-i18n="eval.s03"></section>
<section data-i18n="eval.s04"></section>
<section data-i18n="eval.s05"></section>
<section data-i18n="eval.s06"></section>
<section data-i18n="eval.s07"></section>
<section data-i18n="eval.s08"></section>
<p class="foot" data-i18n="eval.foot"></p>
</div>
<script src="i18n.js"></script>
<script>
(async () => {
  I18N.switcher(document.getElementById('langsw'));
  try {
    const d = await I18N.load(['pages.json']);
    document.title = d.pages.eval.title;
    I18N.apply({ eval: d.pages.eval });
  } catch (e) {
    document.querySelector('[data-i18n="eval.intro"]').innerHTML = 'No se pudo cargar la página. / Could not load the page.<br><code>python3 -m http.server 8080</code>';
  }
})();
</script>
</body>
</html>
