<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>explained like you're 8</title>
<link rel="stylesheet" href="brand.css">
<style>
  .stop { position: absolute; top: 150px; width: 150px; text-align: center; }
  .dot { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 50%; background: var(--panel); border: 3px solid var(--grid); display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black'; font-size: 26px; }
  .lbl { font-size: 15px; font-weight: 700; line-height: 1.25; }
  .small { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .road { position: absolute; left: 120px; top: 181px; width: 690px; height: 6px; background: var(--grid); border-radius: 3px; }
  .roadfill { height: 100%; width: 0; background: var(--mint); border-radius: 3px; }
  .kid { position: absolute; top: 120px; width: 26px; height: 26px; border-radius: 50%; background: var(--gold); border: 3px solid var(--white); }
  .bubble { position: absolute; background: var(--white); color: var(--navy); border-radius: 16px; padding: 10px 14px; font-size: 20px; font-weight: 700; }
  .card2 { position: absolute; width: 150px; height: 92px; border-radius: 12px; background: var(--deep); border: 1.5px solid var(--grid); padding: 10px 12px; font-size: 13px; color: var(--muted); }
  .lamp { width: 50px; height: 50px; border-radius: 50%; margin: 8px auto; border: 2px solid var(--grid); background: #0A2232; }
  .big { font-family: 'Archivo Black'; font-size: 40px; line-height: 1; }
</style>
</head>
<body>
  <div class="abs kicker" style="left:32px;top:22px" data-k="kicker"></div>
  <div class="abs title" style="left:32px;top:42px" id="t1" data-k="t1"></div>
  <div class="abs title" style="left:32px;top:42px;opacity:0" id="t2" data-k="t2"></div>

  <div id="s1">
    <div class="road"><div class="roadfill" id="fill"></div></div>
    <div class="stop" id="p1" style="left:45px"><div class="dot" id="d1">1</div><div class="lbl" data-k="l1"></div><div class="small" data-k="q"></div></div>
    <div class="stop" id="p2" style="left:275px"><div class="dot" id="d2">2</div><div class="lbl" data-k="l2"></div><div class="small" data-k="q"></div></div>
    <div class="stop" id="p3" style="left:505px"><div class="dot" id="d3">3</div><div class="lbl" data-k="l3"></div><div class="small" data-k="q"></div></div>
    <div class="stop" id="p4" style="left:735px"><div class="dot" id="d4">4</div><div class="lbl" data-k="l4"></div><div class="small" data-k="q"></div></div>
    <div class="kid" id="kid" style="left:107px"></div>
    <div class="abs muted" id="s1cap" style="left:32px;top:330px;width:880px;font-size:20px;line-height:1.4" data-k="s1cap"></div>
  </div>

  <div id="s2" style="opacity:0">
    <svg class="abs" id="robot" style="left:40px;top:150px" width="150" height="170" viewBox="0 0 150 170">
      <line x1="75" y1="8" x2="75" y2="28" stroke="#55DFBD" stroke-width="4"/>
      <circle cx="75" cy="8" r="7" fill="#FFC56E"/>
      <rect x="25" y="28" width="100" height="70" rx="18" fill="#123448" stroke="#55DFBD" stroke-width="4"/>
      <circle cx="56" cy="62" r="10" fill="#F4F7F5"/><circle cx="94" cy="62" r="10" fill="#F4F7F5"/>
      <circle cx="58" cy="64" r="4" fill="#071B2B"/><circle cx="96" cy="64" r="4" fill="#071B2B"/>
      <path d="M60 84 Q75 92 90 84" stroke="#F4F7F5" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="40" y="104" width="70" height="56" rx="12" fill="#123448" stroke="#55DFBD" stroke-width="4"/>
      <circle cx="75" cy="132" r="9" fill="#55DFBD"/>
    </svg>
    <div class="abs small" style="left:20px;top:328px;width:190px;text-align:center" data-k="robot"></div>
    <div class="card2" id="c1" style="left:250px;top:140px"><b style="color:var(--white)">#1</b><br><span data-k="ok4"></span><div class="mint" style="font-weight:700;margin-top:4px">✓</div></div>
    <div class="card2" id="c2" style="left:420px;top:140px"><b style="color:var(--white)">#2</b><br><span data-k="ok4"></span><div class="mint" style="font-weight:700;margin-top:4px">✓</div></div>
    <div class="card2" id="c3" style="left:250px;top:250px;border-color:var(--coral)"><b style="color:var(--white)">#3</b><br><span data-k="bad"></span><div class="coral" style="font-weight:700;margin-top:4px" data-k="broken"></div></div>
    <div class="card2" id="c4" style="left:420px;top:250px"><b style="color:var(--white)">…</b><br><span data-k="more"></span></div>
    <div class="bubble" id="shout" style="left:120px;top:96px" data-k="shout"></div>
    <div class="abs" style="left:640px;top:120px;width:100px;height:204px;background:var(--deep);border:2px solid var(--grid);border-radius:22px;padding:4px 0">
      <div class="lamp" id="red"></div><div class="lamp" id="amber"></div><div class="lamp" id="green"></div>
    </div>
    <div class="abs lbl coral" id="stop" style="left:600px;top:340px;width:180px;text-align:center" data-k="stop"></div>
    <div class="abs" id="awake" style="left:780px;top:170px;width:160px">
      <div class="big mint">✓</div>
      <div class="lbl" style="margin-top:8px" data-k="awake"></div>
    </div>
  </div>

  <div class="caption" id="cap" data-k="cap"></div>
  <div class="sign">Cristian Guerra · QA · Medellín</div>

<script src="brand.js"></script>
<script>
const T = {
  en: {
    kicker: "qa-automation-course · explained like you're 8",
    t1: 'A course is a road with four stops',
    l1: 'Basics', l2: 'Pipelines & mutants', l3: 'Checking AI', l4: 'Scientific QA',
    q: 'quiz ✓ · task ✓',
    s1cap: 'At every stop there is a short quiz that grades itself and a task with a “I did it if…” list.',
    t2: 'Is the checking robot awake?',
    robot: 'The robot checks all 429 questions',
    ok4: '4 answers, the right one is #2',
    bad: '4 answers, the right one is #9',
    broken: 'broken on purpose',
    more: 'up to question #429',
    shout: '✗ 1 problem!',
    stop: 'Red light: no publishing',
    awake: 'The robot is awake',
    cap: 'Real: we broke one quiz answer on purpose and scripts/check-course.mjs exited 1. The site only publishes when it says 0 problems.',
  },
  es: {
    kicker: 'qa-automation-course · explicado para un niño de 8 años',
    t1: 'Un curso es un camino con cuatro paradas',
    l1: 'Lo básico', l2: 'Pipelines y mutantes', l3: 'Revisar a la IA', l4: 'QA científico',
    q: 'quiz ✓ · tarea ✓',
    s1cap: 'En cada parada hay un examen corto que se corrige solo y una tarea con una lista de “lo logré si…”.',
    t2: '¿El robot revisor está despierto?',
    robot: 'El robot revisa las 429 preguntas',
    ok4: '4 respuestas, la buena es la #2',
    bad: '4 respuestas, la buena es la #9',
    broken: 'dañada a propósito',
    more: 'hasta la pregunta #429',
    shout: '✗ ¡1 problema!',
    stop: 'Luz roja: no se publica',
    awake: 'El robot está despierto',
    cap: 'Real: dañamos una respuesta del quiz a propósito y scripts/check-course.mjs salió con código 1. El sitio solo se publica cuando dice 0 problemas.',
  },
};
const lang = new URLSearchParams(location.search).get('lang') === 'es' ? 'es' : 'en';
document.documentElement.lang = lang;
document.querySelectorAll('[data-k]').forEach((e) => { e.textContent = T[lang][e.dataset.k]; });

window.DURATION = 14;
window.render = (t) => {
  const out = 1 - p(t, 5.6, 6.2);
  $('s1').style.opacity = out;
  $('t1').style.opacity = p(t, 0, 0.4) * out;
  ['p1', 'p2', 'p3', 'p4'].forEach((id, i) => fade(id, t, 0.4 + i * 0.3, 0.4));
  const k = p(t, 1.8, 4.8);
  $('fill').style.width = `${k * 100}%`;
  $('kid').style.left = `${107 + k * 690}px`;
  [1, 2, 3, 4].forEach((i) => {
    const on = k >= (i - 1) / 3 - 0.001;
    $('d' + i).style.borderColor = on ? '#55DFBD' : '#214456';
  });
  fade('s1cap', t, 2.4, 0.5);
  $('s2').style.opacity = p(t, 6.0, 6.6);
  $('t2').style.opacity = p(t, 6.0, 6.6);
  ['c1', 'c2', 'c3', 'c4'].forEach((id, i) => fade(id, t, 6.6 + i * 0.35, 0.35));
  fade('shout', t, 8.8, 0.3);
  const r = p(t, 9.1, 9.5);
  $('red').style.background = `rgba(251,129,118,${0.15 + 0.85 * r})`;
  $('red').style.boxShadow = `0 0 ${24 * r}px rgba(251,129,118,${0.8 * r})`;
  fade('stop', t, 9.4, 0.4);
  fade('awake', t, 10.8, 0.5);
  fade('cap', t, 11.2, 0.6);
};
</script>
</body>
</html>
