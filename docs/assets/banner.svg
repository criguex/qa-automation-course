<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="qa-automation-course · an interactive QA Automation course in Spanish, from your first test to AI-QA and scientific QA">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#55DFBD" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="r"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="320" fill="#071B2B"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect x="0" y="0" width="8" height="320" fill="#55DFBD"/>
  </g>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="64" y="112" font-size="52" font-weight="700" fill="#F4F7F5">qa-automation-course</text>
    <text x="66" y="160" font-size="22" fill="#F4F7F5">An interactive QA Automation course (in Spanish):</text>
    <text x="66" y="192" font-size="22" fill="#ABC0C8">from your first test to AI-QA and scientific QA,</text>
    <text x="66" y="224" font-size="22" fill="#ABC0C8">built around one idea: test the tester.</text>
    <text x="66" y="276" font-size="15" font-weight="600" fill="#55DFBD">Cristian Guerra · QA · Medellín</text>
  </g>
  <rect x="736" y="64" width="488" height="192" rx="16" fill="#0D2638" stroke="#214456"/>
  <circle cx="760" cy="88" r="5" fill="#214456"/><circle cx="778" cy="88" r="5" fill="#214456"/><circle cx="796" cy="88" r="5" fill="#214456"/>
  <g font-family="Menlo,Consolas,monospace" font-size="15">
    <text x="760" y="132" fill="#F4F7F5">$ node scripts/check-course.mjs</text>
    <text x="760" y="164" fill="#ABC0C8">31 modules · 4 levels + final project</text>
    <text x="760" y="192" fill="#55DFBD">319 quiz questions · 0 problems</text>
    <text x="760" y="228" fill="#8FA6B0"># exit 0 · pages.yml runs it before deploy</text>
  </g>
</svg>
