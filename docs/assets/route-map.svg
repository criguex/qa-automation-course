idad</text><circle cx="620" cy="615" r="5" fill="#FFC56E"/><rect x="646" y="600" width="182" height="46" rx="10" fill="#123448" stroke="#55DFBD"/><text x="658" y="619" font-size="11" font-family="Menlo,Consolas,monospace" fill="#8FA6B0">27</text><text x="658" y="636" font-size="13" fill="#F4F7F5">QA asistida por IA II</text><circle cx="814" cy="615" r="5" fill="#FFC56E"/><path d="M640 664 V680" stroke="#55DFBD" stroke-width="3"/><path d="M633 674 L640 684 L647 674" fill="#55DFBD"/><rect x="40" y="690" width="1200" height="102" rx="14" fill="#0D2638" stroke="#214456"/><text x="64" y="718" font-size="16" font-weight="700" fill="#F4F7F5">Nivel 4 · QA científico</text><rect x="64" y="732" width="182" height="46" rx="10" fill="#123448" stroke="#55DFBD"/><text x="76" y="751" font-size="11" font-family="Menlo,Consolas,monospace" fill="#8FA6B0">28</text><text x="76" y="768" font-size="13" fill="#F4F7F5">Prerregistro y huellas</text><circle cx="232" cy="747" r="5" fill="#FFC56E"/><rect x="258" y="732" width="182" height="46" rx="10" fill="#123448" stroke="#55DFBD"/><text x="270" y="751" font-size="11" font-family="Menlo,Consolas,monospace" fill="#8FA6B0">29</text><text x="270" y="768" font-size="13" fill="#F4F7F5">QA de requisitos</text><rect x="452" y="732" width="182" height="46" rx="10" fill="#123448" stroke="#55DFBD"/><text x="464" y="751" font-size="11" font-family="Menlo,Consolas,monospace" fill="#8FA6B0">30</text><text x="464" y="768" font-size="13" fill="#F4F7F5">Mutantes numéricos</text><circle cx="620" cy="747" r="5" fill="#FB8176"/><rect x="646" y="732" width="182" height="46" rx="10" fill="#123448" stroke="#55DFBD"/><text x="658" y="751" font-size="11" font-family="Menlo,Consolas,monospace" fill="#8FA6B0">31</text><text x="658" y="768" font-size="13" fill="#F4F7F5">Fluidos y estadística</text><rect x="840" y="732" width="182" height="46" rx="10" fill="#123448" stroke="#55DFBD"/><text x="852" y="751" font-size="11" font-family="Menlo,Consolas,monospace" fill="#8FA